<style>
/* =========================================================
   DESIGN TOKENS
   ========================================================= */
:root{
  --pink:#D81B7A;
  --pink-600:#B5135F;
  --pink-700:#8E0E4A;
  --pink-400:#EE4C9B;
  --pink-200:#F8B9D6;
  --blush:#FCE4EF;
  --blush-50:#FFF5FA;
  --plum:#2B1020;
  --plum-2:#4A2238;
  --muted:#6E4B5E;
  --white:#fff;
  --wa:#13914A;
  --wa-dark:#0E7A3D;
  --radius-sm:12px;
  --radius:20px;
  --radius-lg:28px;
  --shadow-sm:0 2px 8px rgba(43,16,32,.06);
  --shadow:0 10px 30px -10px rgba(216,27,122,.25), 0 4px 12px rgba(43,16,32,.06);
  --shadow-lg:0 24px 60px -18px rgba(216,27,122,.40);
  --grad:linear-gradient(135deg,#EE4C9B 0%,#D81B7A 50%,#B5135F 100%);
  --grad-soft:linear-gradient(180deg,#FFF5FA 0%,#FCE4EF 100%);
  --font-body:'Poppins','Noto Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --font-head:'Poppins','Noto Kufi Arabic','Noto Sans Arabic',system-ui,sans-serif;
  --header-h:68px;
  --container:1160px;
}

/* =========================================================
   BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--header-h) + 12px)}
body{
  margin:0;font-family:var(--font-body);color:var(--plum);background:var(--white);
  font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
html[lang="en"] body{line-height:1.65}
img,svg{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);line-height:1.35;margin:0;letter-spacing:-.005em}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3{line-height:1.2;letter-spacing:-.02em}
p{margin:0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.container{width:100%;max-width:var(--container);margin-inline:auto;padding-inline:20px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.icon{width:24px;height:24px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-fill{fill:currentColor;stroke:none}

:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:8px}
.skip-link{position:absolute;inset-inline-start:12px;top:-60px;z-index:200;background:var(--plum);color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:600;transition:top .2s}
.skip-link:focus{top:12px}

/* =========================================================
   BUTTONS
   ========================================================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:52px;padding:12px 26px;border-radius:999px;border:0;cursor:pointer;
  font-weight:700;font-size:1rem;text-decoration:none;white-space:nowrap;
  transition:transform .2s ease, box-shadow .2s ease, background-color .2s ease;
}
.btn .icon{width:22px;height:22px}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--shadow-lg)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 28px 60px -16px rgba(216,27,122,.55)}
.btn-ghost{background:#fff;color:var(--pink-600);border:2px solid var(--pink-200)}
.btn-ghost:hover{border-color:var(--pink);transform:translateY(-2px)}
.btn-white{background:#fff;color:var(--pink-600);box-shadow:0 12px 30px -10px rgba(43,16,32,.35)}
.btn-white:hover{transform:translateY(-2px)}
.btn-outline-white{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.7)}
.btn-outline-white:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}

/* =========================================================
   HEADER
   ========================================================= */
.site-header{
  position:sticky;top:0;z-index:100;height:var(--header-h);
  background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid transparent;transition:border-color .25s, box-shadow .25s;
}
.site-header.scrolled{border-color:rgba(216,27,122,.12);box-shadow:0 6px 24px -14px rgba(43,16,32,.25)}
.header-inner{height:100%;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-inline-end:auto;min-width:0}
.brand img{width:48px;height:48px;border-radius:14px;background:#fff;box-shadow:var(--shadow-sm)}
.brand-name{font-family:var(--font-head);font-weight:800;color:var(--pink);font-size:1.05rem;line-height:1.1;white-space:nowrap}
.brand-name small{display:block;font-family:'Poppins',sans-serif;font-weight:500;color:var(--muted);font-size:.7rem;letter-spacing:.06em}
.main-nav{display:none}
.main-nav a{text-decoration:none;font-weight:600;font-size:.95rem;color:var(--plum-2);padding:8px 12px;border-radius:999px;transition:color .2s, background .2s}
.main-nav a:hover{color:var(--pink);background:var(--blush-50)}

.lang-switch{display:flex;background:var(--blush);border-radius:999px;padding:4px;gap:2px}
.lang-switch button{
  border:0;background:transparent;cursor:pointer;min-height:36px;min-width:42px;padding:4px 10px;border-radius:999px;
  font-size:.85rem;font-weight:700;color:var(--plum-2);transition:background .2s,color .2s;
}
.lang-switch button[lang="ckb"],.lang-switch button[lang="ar"]{font-family:'Noto Sans Arabic',sans-serif}
.lang-switch button[aria-pressed="true"]{background:#fff;color:var(--pink);box-shadow:var(--shadow-sm)}
.header-wa{min-height:44px;width:44px;padding:0;background:var(--wa);color:#fff;box-shadow:0 8px 20px -8px rgba(19,145,74,.6)}
.header-wa:hover{background:var(--wa-dark);transform:translateY(-1px)}
.header-wa span{display:none}

@media (max-width:399px){ .brand-name{display:none} }
@media (min-width:640px){
  .header-wa{width:auto;padding:0 18px}
  .header-wa span{display:inline}
}
@media (min-width:1024px){
  :root{--header-h:76px}
  .main-nav{display:flex;gap:2px;margin-inline-end:8px}
}

/* =========================================================
   HERO
   ========================================================= */
.hero{position:relative;background:var(--grad-soft);overflow:hidden;padding:32px 0 96px}
.hero::before,.hero::after{
  content:"";position:absolute;border-radius:50%;filter:blur(10px);pointer-events:none;
}
.hero::before{width:420px;height:420px;background:radial-gradient(circle,rgba(238,76,155,.22),transparent 70%);top:-120px;inset-inline-end:-140px}
.hero::after{width:360px;height:360px;background:radial-gradient(circle,rgba(216,27,122,.14),transparent 70%);bottom:-80px;inset-inline-start:-120px}
.hero-grid{position:relative;z-index:1;display:grid;gap:36px;align-items:center}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--pink-600);
  padding:6px 14px 6px 6px;border-radius:999px;font-weight:600;font-size:.85rem;box-shadow:var(--shadow-sm)
}
[dir="rtl"] .eyebrow{padding:6px 6px 6px 14px}
.eyebrow-dot{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--grad);color:#fff}
.eyebrow-dot .icon{width:15px;height:15px}
.hero h1{font-size:clamp(1.85rem,6.6vw,3.4rem);font-weight:800;margin:18px 0 14px;color:var(--plum)}
.hero h1 .accent{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{font-size:clamp(1rem,2.6vw,1.15rem);color:var(--muted);max-width:560px}

.rate-badge{
  margin:24px 0 22px;display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;
  background:var(--grad);color:#fff;border-radius:var(--radius);padding:14px 24px 16px;box-shadow:var(--shadow-lg);
  position:relative;overflow:hidden;
}
.rate-badge::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-100%);animation:shine 4.5s ease-in-out infinite 1.5s}
@keyframes shine{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.rate-label{font-size:.85rem;font-weight:600;opacity:.95;display:flex;align-items:center;gap:6px}
.rate-label .live{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.rate-value{font-family:'Poppins',sans-serif;font-weight:800;font-size:clamp(1.7rem,7vw,2.4rem);line-height:1.15;direction:ltr;unicode-bidi:isolate;letter-spacing:-.01em}
.rate-value small{font-size:.55em;font-weight:700;opacity:.95}

.hero-ctas{display:flex;flex-direction:column;gap:12px}
.hero-ctas .btn{width:100%}
.trust-row{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:22px;padding:0;list-style:none}
.trust-row li{display:flex;align-items:center;gap:6px;font-size:.9rem;font-weight:600;color:var(--plum-2)}
.trust-row .icon{width:18px;height:18px;color:var(--pink)}

.hero-visual{position:relative;display:grid;place-items:center;min-height:300px}
.hero-card{
  position:relative;width:min(300px,78vw);aspect-ratio:1;border-radius:50%;
  background:#fff;box-shadow:var(--shadow-lg);display:grid;place-items:center;
}
.hero-card::before{content:"";position:absolute;inset:-18px;border-radius:50%;border:2px dashed rgba(216,27,122,.25);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-card img{width:82%;height:auto;border-radius:50%}
.float-chip{
  position:absolute;display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;
  padding:10px 14px;font-weight:700;font-size:.85rem;box-shadow:var(--shadow);white-space:nowrap;
  animation:floaty 5s ease-in-out infinite;
}
.float-chip .chip-ic{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--blush);color:var(--pink)}
.float-chip .chip-ic .icon{width:18px;height:18px}
.chip-1{top:4%;inset-inline-start:0}
.chip-2{top:40%;inset-inline-end:-4%;animation-delay:-1.6s}
.chip-3{bottom:-2%;inset-inline-start:8%;animation-delay:-3.2s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.wave{position:absolute;inset-inline:0;bottom:-1px;width:100%;height:70px;color:#fff;pointer-events:none}
.wave svg{width:100%;height:100%}

@media (min-width:560px){
  .hero-ctas{flex-direction:row;flex-wrap:wrap}
  .hero-ctas .btn{width:auto}
}
@media (min-width:960px){
  .hero{padding:72px 0 140px}
  .hero-grid{grid-template-columns:1.1fr .9fr;gap:48px}
  .hero-visual{min-height:440px}
  .hero-card{width:380px}
  .float-chip{font-size:.95rem;padding:12px 18px}
}

/* =========================================================
   SECTIONS (shared)
   ========================================================= */
.section{padding:72px 0;position:relative}
.section-blush{background:var(--grad-soft)}
.section-head{text-align:center;max-width:640px;margin:0 auto 40px}
.kicker{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.08em;color:var(--pink);background:var(--blush);padding:4px 14px;border-radius:999px;margin-bottom:12px}
html[lang="en"] .kicker{text-transform:uppercase}
.section-head h2{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:800}
.section-head p{color:var(--muted);margin-top:10px;font-size:1.05rem}
@media (min-width:960px){.section{padding:100px 0}}

/* =========================================================
   FEATURES
   ========================================================= */
.features{display:grid;gap:16px;grid-template-columns:1fr}
.feature{
  background:#fff;border:1px solid rgba(216,27,122,.10);border-radius:var(--radius);padding:24px;
  box-shadow:var(--shadow-sm);transition:transform .25s ease, box-shadow .25s ease, border-color .25s;
  display:flex;gap:16px;align-items:flex-start;
}
.feature:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:rgba(216,27,122,.25)}
.feature-ic{flex-shrink:0;display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:var(--blush);color:var(--pink)}
.feature-ic .icon{width:26px;height:26px}
.feature h3{font-size:1.1rem;font-weight:700;margin-bottom:4px}
.feature p{color:var(--muted);font-size:.95rem}
.feature.feature-hero{background:var(--grad);color:#fff;border:0}
.feature.feature-hero .feature-ic{background:rgba(255,255,255,.2);color:#fff}
.feature.feature-hero p{color:rgba(255,255,255,.92)}
.feature .big-rate{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.45rem;direction:ltr;unicode-bidi:isolate;display:block;margin:2px 0 6px;text-align:left;white-space:nowrap}
[dir="rtl"] .feature .big-rate,[dir="rtl"] .res-value{text-align:right}
@media (min-width:640px){
  .features{grid-template-columns:repeat(2,1fr)}
  .feature{flex-direction:column}
  .feature.feature-hero{grid-column:1/-1}
}
@media (min-width:1024px){
  .features{grid-template-columns:repeat(6,1fr)}
  .feature{grid-column:span 2}
  .feature.feature-hero{grid-column:span 2;grid-row:span 2;justify-content:center}
  .feature:nth-child(4),.feature:nth-child(5){grid-column:span 2}
}

/* =========================================================
   HOW IT WORKS
   ========================================================= */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:18px;counter-reset:step;position:relative}
.step{position:relative;background:#fff;border-radius:var(--radius);padding:22px 22px 22px;box-shadow:var(--shadow-sm);display:flex;gap:16px;align-items:flex-start}
.step-num{
  flex-shrink:0;position:relative;z-index:1;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;
  background:var(--grad);color:#fff;font-family:'Poppins',sans-serif;font-weight:800;font-size:1.1rem;box-shadow:0 8px 18px -6px rgba(216,27,122,.55)
}
.step h3{font-size:1.05rem;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.step h3 .icon{width:20px;height:20px;color:var(--pink)}
.step p{color:var(--muted);font-size:.95rem}
/* vertical connector on mobile */
.steps::before{content:"";position:absolute;top:40px;bottom:40px;inset-inline-start:47px;width:2px;background:repeating-linear-gradient(to bottom,var(--pink-200) 0 6px,transparent 6px 12px)}
.how-cta{text-align:center;margin-top:36px}
@media (min-width:960px){
  .steps{grid-template-columns:repeat(4,1fr);gap:22px}
  .steps::before{top:50px;bottom:auto;inset-inline:12%;width:auto;height:2px;background:repeating-linear-gradient(to right,var(--pink-200) 0 8px,transparent 8px 16px)}
  .step{flex-direction:column;align-items:center;text-align:center;padding:24px 20px 28px;background:transparent;box-shadow:none}
  .step-num{width:60px;height:60px;font-size:1.25rem;outline:8px solid var(--blush-50)}
  .step h3{justify-content:center;margin-top:6px}
}

/* =========================================================
   CALCULATOR
   ========================================================= */
.calc-wrap{
  display:grid;gap:0;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;
  max-width:920px;margin:0 auto;border:1px solid rgba(216,27,122,.12)
}
.calc-form{padding:28px 22px}
.calc-form label{display:block;font-weight:700;margin-bottom:10px}
.input-wrap{position:relative;direction:ltr}
.input-wrap .cur{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-family:'Poppins',sans-serif;font-weight:800;font-size:1.4rem;color:var(--pink)}
.calc-input{
  width:100%;height:64px;border-radius:16px;border:2px solid var(--pink-200);background:var(--blush-50);
  padding:0 18px 0 46px;font-family:'Poppins',sans-serif;font-weight:700;font-size:1.5rem;color:var(--plum);
  transition:border-color .2s, box-shadow .2s;text-align:left;
}
.calc-input::placeholder{color:#B892A6;font-weight:500;font-size:1.05rem;font-family:var(--font-body)}
.calc-input:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 4px rgba(216,27,122,.15);background:#fff}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;direction:ltr;justify-content:flex-start}
[dir="rtl"] .quick{justify-content:flex-end}
.quick button{
  flex:1 1 0;min-width:56px;border:1.5px solid var(--pink-200);background:#fff;color:var(--pink-600);border-radius:999px;min-height:40px;padding:4px 16px;
  font-family:'Poppins',sans-serif;font-weight:600;cursor:pointer;transition:all .2s
}
.quick button:hover{background:var(--blush);border-color:var(--pink)}
.calc-hint{font-size:.85rem;color:var(--muted);margin-top:14px}
.calc-result{background:var(--grad);color:#fff;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;gap:6px;position:relative;overflow:hidden}
.calc-result::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08);top:-100px;inset-inline-end:-90px}
.calc-result .res-label{font-weight:600;opacity:.95;position:relative}
.res-value{font-family:'Poppins',sans-serif;font-weight:800;font-size:clamp(2rem,8vw,2.8rem);line-height:1.15;direction:ltr;unicode-bidi:isolate;text-align:start;position:relative;word-break:break-all}
.res-value small{font-size:.45em;font-weight:700;opacity:.95}
.res-sub{font-size:.88rem;opacity:.92;position:relative}
.calc-result .btn{margin-top:16px;position:relative;width:100%}
.calc-result .btn[aria-disabled="true"]{opacity:.65;pointer-events:none}
@media (min-width:760px){
  .calc-wrap{grid-template-columns:1.1fr 1fr}
  .calc-form,.calc-result{padding:40px}
}

/* =========================================================
   CATEGORIES
   ========================================================= */
.cats{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
.cat{
  position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:3/4;text-decoration:none;color:#fff;
  box-shadow:var(--shadow-sm);isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;
  transition:transform .3s ease, box-shadow .3s ease;
}
.cat:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.cat-media{position:absolute;inset:0;z-index:-2;display:grid;place-items:center}
.cat-media img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.cat:hover .cat-media img{transform:scale(1.05)}
.cat-media .cat-ic{width:32%;height:auto;color:rgba(255,255,255,.9);stroke-width:1.4;margin-bottom:38%}
.cat::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(43,16,32,.72) 0%,rgba(43,16,32,.15) 45%,transparent 70%)}
.cat-1 .cat-media{background:linear-gradient(160deg,#F9A8CF 0%,#D81B7A 100%)}
.cat-2 .cat-media{background:linear-gradient(160deg,#FFD3E5 0%,#EE4C9B 100%)}
.cat-3 .cat-media{background:linear-gradient(160deg,#C9577F 0%,#7A1640 100%)}
.cat-4 .cat-media{background:linear-gradient(160deg,#F6C1D8 0%,#B5135F 100%)}
.cat h3{font-size:1.1rem;font-weight:700}
.cat p{font-size:.82rem;opacity:.92;line-height:1.5;margin-top:2px}
.cat-arrow{position:absolute;top:14px;inset-inline-end:14px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);display:grid;place-items:center}
.cat-arrow .icon{width:18px;height:18px}
[dir="rtl"] .cat-arrow .icon{transform:scaleX(-1)}
@media (min-width:960px){
  .cats{grid-template-columns:repeat(4,1fr);gap:20px}
  .cat{padding:22px}
  .cat h3{font-size:1.25rem}
  .cat p{font-size:.9rem}
}

/* =========================================================
   TESTIMONIALS
   ========================================================= */
.reviews{display:grid;gap:16px}
.review{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-sm);border:1px dashed var(--pink-200);position:relative}
.review .quote-mark{font-family:Georgia,serif;font-size:4rem;line-height:1;color:var(--pink-200);height:34px;display:block}
.review blockquote{margin:6px 0 18px;color:var(--plum-2);font-size:1rem}
.review footer{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.review cite{font-style:normal;font-weight:700;display:block}
.review .city{font-size:.85rem;color:var(--muted)}
.ph-tag{position:absolute;top:14px;inset-inline-end:14px;font-size:.7rem;font-weight:700;background:var(--blush);color:var(--pink-700);padding:2px 10px;border-radius:999px}
.reviews-cta{text-align:center;margin-top:28px}
.trust-card{border-style:solid;border-color:rgba(216,27,122,.12);text-align:center;transition:transform .25s ease, box-shadow .25s ease}
.trust-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.trust-card .feature-ic{margin:0 auto 14px}
.trust-card h3{font-size:1.15rem;font-weight:700;margin-bottom:6px}
.trust-card p{color:var(--muted);font-size:.95rem}
.ig-link{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--pink-600);text-decoration:none;padding:10px 18px;border-radius:999px;background:var(--blush)}
.ig-link:hover{background:var(--pink-200)}
@media (min-width:760px){.reviews{grid-template-columns:repeat(3,1fr)}}

/* =========================================================
   FAQ
   ========================================================= */
.faq{max-width:780px;margin:0 auto;display:grid;gap:12px}
.faq details{background:#fff;border-radius:18px;box-shadow:var(--shadow-sm);border:1px solid rgba(216,27,122,.10);transition:box-shadow .2s, border-color .2s}
.faq details[open]{box-shadow:var(--shadow);border-color:rgba(216,27,122,.25)}
.faq summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:18px 20px;font-weight:700;font-size:1.02rem;min-height:60px;border-radius:18px
}
.faq summary::-webkit-details-marker{display:none}
.faq summary .chev{flex-shrink:0;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--blush);color:var(--pink);transition:transform .3s ease, background .2s}
.faq summary .chev .icon{width:18px;height:18px}
.faq details[open] summary .chev{transform:rotate(180deg);background:var(--pink);color:#fff}
.faq .answer{padding:0 20px 20px;color:var(--muted)}
.faq details[open] .answer{animation:fadeDown .3s ease}
@keyframes fadeDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* =========================================================
   FINAL CTA
   ========================================================= */
.final-cta{padding:0 0 72px}
.cta-banner{
  position:relative;overflow:hidden;background:var(--grad);color:#fff;border-radius:var(--radius-lg);
  padding:44px 24px;text-align:center;box-shadow:var(--shadow-lg)
}
.cta-banner::before,.cta-banner::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.cta-banner::before{width:300px;height:300px;top:-140px;inset-inline-start:-80px}
.cta-banner::after{width:220px;height:220px;bottom:-110px;inset-inline-end:-40px}
.cta-banner > *{position:relative;z-index:1}
.cta-banner h2{font-size:clamp(1.6rem,5.4vw,2.5rem);font-weight:800}
.cta-banner p{margin:10px auto 26px;max-width:520px;opacity:.95;font-size:1.05rem}
.cta-actions{display:flex;flex-direction:column;gap:12px;align-items:stretch;max-width:340px;margin:0 auto}
.cta-handle{margin-top:18px;font-family:'Poppins',sans-serif;font-weight:600;opacity:.9;direction:ltr}
@media (min-width:560px){.cta-actions{flex-direction:row;max-width:none;justify-content:center}}
@media (min-width:960px){.cta-banner{padding:72px 40px}.final-cta{padding-bottom:100px}}

/* =========================================================
   FOOTER
   ========================================================= */
.site-footer{background:var(--plum);color:#F5DCE8;padding:48px 0 calc(28px + env(safe-area-inset-bottom))}
.footer-top{display:grid;gap:28px;align-items:start}
.footer-brand{display:flex;align-items:center;gap:12px}
.footer-brand img{width:60px;height:60px;border-radius:16px;background:#fff}
.footer-brand strong{font-family:var(--font-head);font-size:1.15rem;color:#fff;display:block;line-height:1.3}
.footer-brand span{font-size:.9rem;color:#E3BCD0}
.footer-links{display:flex;flex-wrap:wrap;gap:10px}
.footer-links a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.92rem;transition:background .2s}
.footer-links a:hover{background:rgba(255,255,255,.16)}
.footer-links .icon{width:20px;height:20px}
.footer-bottom{margin-top:32px;padding-top:22px;border-top:1px solid rgba(255,255,255,.12);display:grid;gap:8px;font-size:.85rem;color:#D9B3C6}
@media (min-width:760px){
  .footer-top{grid-template-columns:1fr auto;align-items:center}
  .footer-bottom{grid-template-columns:1fr auto}
}

/* =========================================================
   FLOATING WHATSAPP  (inline-end = bottom-left in RTL, bottom-right in LTR)
   ========================================================= */
.wa-float{
  position:fixed;z-index:90;bottom:calc(18px + env(safe-area-inset-bottom));inset-inline-end:18px;
  width:60px;height:60px;border-radius:50%;background:var(--wa);color:#fff;display:grid;place-items:center;
  box-shadow:0 12px 28px -8px rgba(19,145,74,.65);text-decoration:none;transition:transform .2s ease, background .2s;
}
.wa-float:hover{transform:scale(1.07);background:var(--wa-dark)}
.wa-float .icon{width:32px;height:32px}
.wa-float::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--wa);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.6);opacity:0}}

/* =========================================================
   SCROLL REVEAL (only when JS is running)
   ========================================================= */
.js .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1)}
.js .reveal.in{opacity:1;transform:none}
.js .reveal[data-delay="1"]{transition-delay:.08s}
.js .reveal[data-delay="2"]{transition-delay:.16s}
.js .reveal[data-delay="3"]{transition-delay:.24s}
.js .reveal[data-delay="4"]{transition-delay:.32s}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important}
  .js .reveal{opacity:1;transform:none}
}

    String(str).split(/\{(rate|ig)\}/).forEach((part, i) => {
      if (i % 2 === 1) { const b = document.createElement('bdi'); b.dir = 'ltr'; b.textContent = tokens[part](); el.appendChild(b); }
      else if (part) el.appendChild(document.createTextNode(part));
    });
  }

  const t = key => (translations[lang] && translations[lang][key] != null ? translations[lang][key] : translations.en[key]);

  /* ---------- rate everywhere ---------- */
  document.querySelectorAll('[data-rate-usd]').forEach(el => { el.textContent = '100$'; });
  document.querySelectorAll('[data-rate-iqd]').forEach(el => { el.textContent = fmt(CONFIG.RATE_IQD_PER_100_USD); });
  document.querySelectorAll('[data-ig]').forEach(el => { el.href = 'https://www.instagram.com/' + CONFIG.INSTAGRAM_USER + '/'; });
  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---------- FAQ builder ---------- */
  const faqList = document.getElementById('faqList');
  function renderFaq() {
    const openIdx = [...faqList.querySelectorAll('details')].findIndex(d => d.open);
    faqList.textContent = '';
    t('faq').forEach(([q, a], i) => {
      const d = document.createElement('details');
      d.className = 'reveal in';
      if (i === openIdx) d.open = true;
      const s = document.createElement('summary');
      const qs = document.createElement('span'); qs.textContent = q;
      const chev = document.createElement('span'); chev.className = 'chev'; chev.setAttribute('aria-hidden', 'true');
      chev.innerHTML = '<svg class="icon"><use href="#i-chev"/></svg>';
      s.append(qs, chev);
      const ans = document.createElement('div'); ans.className = 'answer';
      const p = document.createElement('p'); setText(p, a);
      ans.appendChild(p);
      d.append(s, ans);
      faqList.appendChild(d);
    });
  }

  /* ---------- calculator ---------- */
  const input = document.getElementById('usdInput');
  const output = document.getElementById('iqdOutput');
  const calcWa = document.getElementById('calcWa');
  const toLatinDigits = s => s
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٫,]/g, '.');

  function updateCalc() {
    let raw = toLatinDigits(input.value).replace(/[^\d.]/g, '');
    const parts = raw.split('.');
    if (parts.length > 2) raw = parts[0] + '.' + parts.slice(1).join('');
    if (raw !== input.value) input.value = raw;
    const usd = parseFloat(raw);
    const valid = isFinite(usd) && usd > 0;
    const iqd = valid ? usd * CONFIG.RATE_IQD_PER_100_USD / 100 : 0;
    output.innerHTML = fmt(iqd) + ' <small>IQD</small>';
    if (valid) {
      calcWa.href = waLink(fill(t('waCalc'), { usd: (Math.round(usd * 100) / 100).toString(), iqd: fmt(iqd) }));
      calcWa.removeAttribute('aria-disabled');
      calcWa.removeAttribute('tabindex');
    } else {
      calcWa.href = waLink(t('waGreeting'));
      calcWa.setAttribute('aria-disabled', 'true');
      calcWa.setAttribute('tabindex', '-1');
    }
  }
  input.addEventListener('input', updateCalc);
  document.getElementById('calcForm').addEventListener('submit', e => { e.preventDefault(); input.blur(); });
  document.querySelectorAll('.quick [data-amount]').forEach(b => b.addEventListener('click', () => { input.value = b.dataset.amount; updateCalc(); }));

  /* ---------- apply language ---------- */
  function applyLang(next) {
    if (!translations[next]) next = 'ku';
    lang = next;
    const meta = LANG_META[lang];
    const root = document.documentElement;
    root.lang = meta.html;
    root.dir = meta.dir;

    const vars = { rate: rateText() };
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = t(el.dataset.i18n);
      if (typeof v === 'string') setText(el, v);
    });
    document.querySelectorAll('[data-i18n-attr]').forEach(el => {
      el.dataset.i18nAttr.split(';').forEach(pair => {
        const [attr, key] = pair.split(':');
        if (attr && key) el.setAttribute(attr.trim(), fill(t(key.trim()), vars));
      });
    });

    document.title = t('metaTitle');
    const md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute('content', t('metaDesc'));

    // WhatsApp links with greeting in current language
    document.querySelectorAll('[data-wa]').forEach(a => {
      const cat = a.dataset.waCat;
      const msg = cat && t('waCat') && t('waCat')[cat] ? t('waCat')[cat] : t('waGreeting');
      a.href = waLink(msg);
    });

    document.querySelectorAll('.lang-switch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));

    renderFaq();
    updateCalc();
    try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) { /* storage blocked */ }
  }

  document.querySelectorAll('.lang-switch button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));
  applyLang(lang);

  /* ---------- header shadow on scroll ---------- */
  const header = document.querySelector('.site-header');
  const onScroll = () => header.classList.toggle('scrolled', window.scrollY > 8);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* ---------- scroll reveal ---------- */
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items = document.querySelectorAll('.reveal:not(.in)');
  if (reduce || !('IntersectionObserver' in window)) {
    items.forEach(el => el.classList.add('in'));
  } else {
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
    items.forEach(el => io.observe(el));
  }
})();
</script>
</body>
</html>
